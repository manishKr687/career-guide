# SonarQube, kept out of docker-compose.yml on purpose.
#
#   docker compose -f docker-compose.sonar.yml up -d      # start it
#   docker compose -f docker-compose.sonar.yml down        # stop it
#   docker compose -f docker-compose.sonar.yml logs -f     # watch it boot (slow)
#
# WHY IT IS A SEPARATE FILE. It used to be a service in docker-compose.yml --
# the file a deployment runs. That put a code-quality server on the production
# host, published on 0.0.0.0:9000, with SonarQube's default admin/admin login.
# Anyone who found the port owned it, and from there the analysis history of the
# whole codebase. A quality tool has no business on a server that serves users.
#
# Splitting it also means `docker compose up` for the app no longer waits on, or
# allocates memory for, a service that is only wanted when someone is actually
# running a scan. SonarQube asks for around 2 GB and takes a minute to become
# healthy.
#
# Bound to loopback for the same reason as the API and the database: nothing here
# should be reachable from another machine.
#
# The scanner is driven by scripts/sonar.sh at the repo root, which prompts for a
# token rather than storing one. Note that a token prefixed sqp_ is a PROJECT
# token, scoped to a single project -- scanning both the backend and the frontend
# in one run needs a Global Analysis Token.

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

volumes:
  # Declared here, but Docker names them after the project directory, so these
  # are the same volumes the previous combined file created -- the existing
  # analysis history, quality profiles and the admin password survive the move.
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
