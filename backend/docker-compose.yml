services:
  postgres:
    image: postgres:16-alpine
    container_name: careerguide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careerguide
      POSTGRES_USER: careerguide
      # Overridable for the same reason as the admin secrets below; the
      # fallback is a development convenience, not a password.
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-careerguide}
    ports:
      # Bound to loopback rather than 0.0.0.0: publishing Postgres to every
      # interface exposes it to anything that can reach this host, and only
      # tools on this machine (psql, the backup scripts) need it. Docker
      # publishes to all interfaces when the host IP is omitted, which also
      # bypasses the host firewall.
      - "127.0.0.1:5432:5432"
    volumes:
      - careerguide-postgres-data:/var/lib/postgresql/data
      # Bind-mounted so backup/restore scripts can read and write files here
      # directly from inside the container — see scripts/backup-db.* and
      # scripts/restore-db.* and the "Backups" section of README.md.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerguide -d careerguide"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerguide-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careerguide
      SPRING_DATASOURCE_USERNAME: careerguide
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-careerguide}
      CAREERGUIDE_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3311
      # Override these in a backend/.env file (gitignored) rather than editing
      # this file -- docker compose loads backend/.env automatically. See the
      # "Admin panel" section of README.md.
      #
      # The fallbacks below are published in a public repository, so they are
      # known values rather than weak ones. Set SPRING_PROFILES_ACTIVE=prod for
      # any deployment reachable from outside this machine: the prod profile
      # declares all of them with no default, so the app refuses to start on a
      # fallback instead of silently accepting one. See application-prod.yml.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CAREERGUIDE_ADMIN_PASSWORD: ${CAREERGUIDE_ADMIN_PASSWORD:-admin123}
      CAREERGUIDE_ADMIN_TOKEN_SECRET: ${CAREERGUIDE_ADMIN_TOKEN_SECRET:-dev-only-change-this-admin-token-secret}
      CAREERGUIDE_USER_TOKEN_SECRET: ${CAREERGUIDE_USER_TOKEN_SECRET:-dev-only-change-this-user-token-secret}
    ports:
      # Loopback only, for the same reason as postgres above. In a deployment the
      # only thing that should listen publicly is the reverse proxy terminating
      # TLS; this published on 0.0.0.0, which meant the API was reachable from
      # the internet over plain HTTP. Every admin password, user password and
      # session token on this API travels in the request body or an Authorization
      # header, so unencrypted public exposure is the whole threat model at once.
      #
      # 127.0.0.1 still works for everything that needs it: `next start` on the
      # host, the smoke and sync-check scripts, and a reverse proxy on the same
      # machine. A containerised frontend would reach it over the compose network
      # by service name instead, which does not need a published port at all.
      - "127.0.0.1:8081:8080"

volumes:
  careerguide-postgres-data:
